# Low-speed simulation parameters; production planning/tracking defaults are unchanged.
trajectory_generation:
  ros__parameters:
    planner.robot_radius: 0.45
    topics.goal: /sim/planner_goal
    topics.global_trajectory: /sim/planned_trajectory
    planner.reference_desire_speed: 0.3
    planner.reference_desire_speed_xtl: 0.3
    planner.reference_v_max: 0.45
    planner.reference_a_max: 0.35
    planner.reference_axtl_max: 0.35
trajectory_tracking:
  ros__parameters:
    output.max_speed: 0.45
    arrival.distance: 0.12
    collision.penalty_mu: 1.0
