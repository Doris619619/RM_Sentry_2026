# 此文件用于配置左 MID360、Point-LIO 里程计与 CPU NDT_OMP 的 HDL 定位默认参数。
/**:
  ros__parameters:
    points_topic: /filted_topic_3d
    globalmap_topic: /globalmap
    odom_topic: /point_lio/odometry
    robot_odom_frame_id: odom
    odom_child_frame_id: base_link
    send_tf_transforms: true
    tf_lookup_timeout_seconds: 0.1
    max_prediction_age_seconds: 0.2
    cloud_qos_depth: 5
    odom_qos_depth: 20
    enable_robot_odometry_prediction: true
    use_imu: false
    use_global_localization: false
    reg_method: NDT_OMP
    ndt_neighbor_search_method: DIRECT7
    ndt_resolution: 1.0
    downsample_resolution: 0.1
    cool_time_duration: 0.5
    specify_init_pose: true
    init_pos_x: 0.0
    init_pos_y: 0.0
    init_pos_z: 0.0
    init_ori_w: 1.0
    init_ori_x: 0.0
    init_ori_y: 0.0
    init_ori_z: 0.0
    convert_utm_to_local: false
